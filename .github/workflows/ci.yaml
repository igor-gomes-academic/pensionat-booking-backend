name: Booking Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: booking-backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DB_HOST: ${{ vars.CI_DB_HOST }}
      DB_PORT: ${{ vars.CI_DB_PORT }}
      DB_NAME: ${{ vars.CI_DB_NAME }}
      DB_USERNAME: ${{ secrets.CI_DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      CUSTOMER_SERVICE_URL: http://127.0.0.1:8081

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ${{ vars.CI_DB_NAME }}
          MYSQL_USER: ${{ secrets.CI_DB_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASSWORD }}
          TZ: Europe/Stockholm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Start Customer Service stub
        run: |
          python3 -m http.server 8081 > /tmp/customer-service.log 2>&1 &

          for attempt in {1..10}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              http://127.0.0.1:8081/api/customers/99999 || true)

            if [ "$status" = "404" ]; then
              exit 0
            fi

            sleep 1
          done

          cat /tmp/customer-service.log
          exit 1

      - name: Build and run tests
        run: ./mvnw -B clean verify -Dspring.profiles.active=test
