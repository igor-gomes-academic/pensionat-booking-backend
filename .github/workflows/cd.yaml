name: Booking Backend CD

on:
  workflow_run:
    workflows:
      - Booking Backend CI
    branches:
      - main
    types:
      - completed

concurrency:
  group: booking-backend-cd
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Check image changes
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      image_changed: ${{ steps.filter.outputs.image_changed }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Check image-related changes
        id: filter
        shell: bash
        run: |
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "image_changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD -- \
            src \
            .mvn \
            pom.xml \
            mvnw \
            Dockerfile \
            .dockerignore \
            .github/workflows/cd.yaml; then
            echo "image_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "image_changed=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Build and publish image
    needs:
      - changes
    if: needs.changes.outputs.image_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pensionat-booking-backend:staging
            ${{ secrets.DOCKERHUB_USERNAME }}/pensionat-booking-backend:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=${{ github.event.workflow_run.repository.html_url }}

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway redeploy --service booking-service-staging --yes
